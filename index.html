<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Career Command Center — a 24-month operating system for becoming an internationally competitive Senior Product Manager."
    />
    <title>Career Command Center</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B5BD6'/%3E%3Cpath d='M9 22V10h5.4a4.1 4.1 0 0 1 0 8.2H12V22H9Zm3-6.2h2.3a1.7 1.7 0 0 0 0-3.4H12v3.4Z' fill='white'/%3E%3Ccircle cx='22' cy='20' r='2.4' fill='%2334D399'/%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('ccc.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* first run, private mode, or storage disabled — the dark default stands */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
